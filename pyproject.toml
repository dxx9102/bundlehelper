[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bundlehelper"
version = "0.1.0"
description = "Windows GUI for offline Git bundle synchronization over SSH"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "keyring>=25.6",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11",
  "pytest>=8.3",
  "pytest-qt>=4.4",
]

[project.scripts]
bundlehelper = "bundlehelper.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bundlehelper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]